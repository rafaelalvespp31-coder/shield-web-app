<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShielD — Administrador</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #0A0F14; color: #fff; min-height: 100vh; }
  .hidden { display: none !important; }

  /* LOGIN */
  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .loginBox { width: 100%; max-width: 380px; background: #121A22; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 32px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #F59E0B; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; font-weight: 900; color: #0A0F14; font-size: 18px; }
  .loginBox h1 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
  .loginBox p.sub { color: #8A97A3; font-size: 12.5px; margin-bottom: 24px; }
  label { color: #8A97A3; font-size: 11px; font-weight: 600; display: block; margin-bottom: 6px; }
  input { width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; background: #0A0F14; border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 13px; outline: none; margin-bottom: 14px; }
  input:focus { border-color: rgba(245,158,11,0.5); }
  .errMsg { color: #F87171; font-size: 12px; margin-bottom: 14px; }
  button.primary { width: 100%; height: 44px; border-radius: 999px; background: #F59E0B; color: #0A0F14; font-weight: 800; font-size: 13px; border: none; cursor: pointer; }
  button.primary:disabled { opacity: 0.6; cursor: default; }

  /* PAINEL */
  #painel { min-height: 100vh; padding: 28px 18px 60px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .topRow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .topRow h1 { font-size: 21px; font-weight: 900; }
  .topRow p { color: #8A97A3; font-size: 12px; margin-top: 3px; }
  #sairBtn { height: 36px; padding: 0 16px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #8A97A3; font-size: 12px; font-weight: 700; cursor: pointer; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabBtn { height: 38px; padding: 0 16px; border-radius: 999px; border: none; cursor: pointer; font-size: 12.5px; font-weight: 700; background: #121A22; color: #8A97A3; }
  .tabBtn.active { background: #F59E0B; color: #0A0F14; }

  .card { background: #121A22; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card .info { min-width: 200px; }
  .card .nome { font-size: 13.5px; font-weight: 700; }
  .card .detalhe { color: #8A97A3; font-size: 11.5px; margin-top: 2px; }
  .card .data { color: #5B6572; font-size: 10.5px; margin-top: 2px; }
  .card .direita { display: flex; align-items: center; gap: 14px; }
  .valor { color: #F59E0B; font-size: 17px; font-weight: 900; }
  .valorVerde { color: #10B981; }
  button.acao { height: 38px; padding: 0 16px; border-radius: 10px; background: #10B981; color: #06231A; font-weight: 800; font-size: 12px; border: none; cursor: pointer; white-space: nowrap; }
  button.acao:disabled { opacity: 0.5; cursor: default; }
  .pagoTag { font-size: 11px; color: #10B981; font-weight: 700; }
  .badge { font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 700; }
  .badge.ouro { background: rgba(245,158,11,0.15); color: #F59E0B; }
  .badge.prata { background: rgba(203,213,225,0.15); color: #CBD5E1; }
  .badge.bronze { background: rgba(180,83,9,0.15); color: #C2703D; }
  .badge.online { background: rgba(16,185,129,0.15); color: #10B981; }
  .badge.offline { background: rgba(148,163,184,0.15); color: #94A3B8; }

  .empty { color: #8A97A3; font-size: 13px; text-align: center; padding: 40px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 16px; }
  .loading { color: #8A97A3; font-size: 13px; text-align: center; padding: 40px; }

  /* DOCUMENTOS */
  .subTabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .subTabBtn { height: 32px; padding: 0 14px; border-radius: 999px; border: none; cursor: pointer; font-size: 11.5px; font-weight: 700; background: #121A22; color: #8A97A3; border: 1px solid rgba(255,255,255,0.08); }
  .subTabBtn.active { background: #F59E0B; color: #0A0F14; border-color: transparent; }
  .docCard { background: #121A22; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
  .docTopo { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .docBotoes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button.docBtn { height: 34px; padding: 0 14px; border-radius: 10px; background: #1A2530; color: #D1D5DB; font-size: 11.5px; font-weight: 700; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; }
  button.docBtn:disabled { background: #161C24; color: #5B6572; cursor: not-allowed; }
  .badge.pending, .badge.em_analise { background: rgba(245,158,11,0.15); color: #F59E0B; }
  .badge.aprovado { background: rgba(16,185,129,0.15); color: #10B981; }
  .badge.rejeitado { background: rgba(239,68,68,0.15); color: #EF4444; }
  .motivoRejeitado { color: #EF4444; font-size: 11.5px; margin-bottom: 10px; background: rgba(239,68,68,0.08); border-radius: 8px; padding: 8px; }
  .docAcoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px; }
  .docAcoes input { flex: 1 1 200px; height: 34px; margin-bottom: 0; font-size: 11.5px; }
  button.rejeitarBtn { height: 34px; padding: 0 14px; border-radius: 10px; background: transparent; color: #EF4444; font-size: 11.5px; font-weight: 700; border: 1px solid rgba(239,68,68,0.4); cursor: pointer; white-space: nowrap; }
  button.aprovarBtn { height: 34px; padding: 0 16px; border-radius: 10px; background: #10B981; color: #06231A; font-size: 11.5px; font-weight: 800; border: none; cursor: pointer; white-space: nowrap; }
  button.rejeitarBtn:disabled, button.aprovarBtn:disabled { opacity: 0.5; cursor: default; }

  /* ONLINE AGORA */
  .onlineTopo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .onlineContagem { font-size: 12px; color: #8A97A3; }
  .onlineContagem b { color: #10B981; font-size: 15px; }
  .pulseDot { width: 8px; height: 8px; border-radius: 999px; background: #10B981; display: inline-block; margin-right: 8px; box-shadow: 0 0 0 0 rgba(16,185,129,0.6); animation: pulseDot 1.6s infinite; }
  @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); } 70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
  .onlineCard { background: #121A22; border: 1px solid rgba(16,185,129,0.25); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .onlineCard .esquerda { display: flex; align-items: center; }
  .onlineCard .rating { color: #F59E0B; font-size: 11.5px; font-weight: 700; }

  /* TODAS AS CONTAS */
  .buscaContas { width: 100%; max-width: 420px; margin-bottom: 14px; }
  .roleTag { font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 700; }
  .roleTag.client { background: rgba(78,217,240,0.15); color: #4ED9F0; }
  .roleTag.provider { background: rgba(255,215,0,0.15); color: #FFD700; }
  .roleTag.company { background: rgba(16,185,129,0.15); color: #10B981; }
  .contaCard .email { color: #8A97A3; font-size: 11.5px; margin-top: 2px; word-break: break-all; }

  /* PERFIL TÁTICO */
  .taticoAlerta { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; color: #FCA5A5; font-size: 11.5px; line-height: 1.5; }
  .toggleSwitch { position: relative; width: 44px; height: 24px; border-radius: 999px; border: none; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
  .toggleSwitch.off { background: #1E293B; }
  .toggleSwitch.on { background: #10B981; }
  .toggleSwitch .bolinha { position: absolute; top: 3px; width: 18px; height: 18px; border-radius: 999px; background: #fff; transition: left 0.2s; }
  .toggleSwitch.off .bolinha { left: 3px; }
  .toggleSwitch.on .bolinha { left: 23px; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://xnnhhhsxoaprgvfvqaak.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QzFnirQmvpN4WVwxiBBVeg_zVMNC7O1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function fmtBRL(v) { return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function fmtData(d) { return new Date(d).toLocaleString('pt-BR'); }
function extrairChavePix(descricao) {
  const m = (descricao || '').match(/chave:\s*(.+)$/i);
  return m ? m[1].trim() : (descricao || '-');
}

let abaAtiva = 'saques';
let cacheNomes = {};

async function buscarNomes(ids) {
  const faltando = ids.filter((id) => !cacheNomes[id]);
  if (faltando.length === 0) return;
  const { data: profs } = await sb.from('profiles').select('id, full_name').in('id', faltando);
  (profs || []).forEach((p) => { cacheNomes[p.id] = p.full_name; });
  const semNome = faltando.filter((id) => !cacheNomes[id]);
  if (semNome.length > 0) {
    const { data: emps } = await sb.from('empresas_parceiras').select('id, razao_social').in('id', semNome);
    (emps || []).forEach((e) => { cacheNomes[e.id] = e.razao_social + ' (empresa)'; });
  }
}

async function renderSaques(status, tituloVazio) {
  const conteudo = document.getElementById('conteudo');
  conteudo.innerHTML = '<div class="loading">Carregando...</div>';
  const { data, error } = await sb
    .from('wallet_transactions')
    .select('id, wallet_id, amount, description, created_at')
    .eq('type', 'withdrawal').eq('status', status)
    .order('created_at', { ascending: status === 'pending' });
  if (error) { conteudo.innerHTML = '<div class="empty">Erro ao carregar: ' + error.message + '</div>'; return; }

  const lista = data || [];
  if (lista.length === 0) { conteudo.innerHTML = '<div class="empty">' + tituloVazio + '</div>'; return; }

  await buscarNomes(lista.map((t) => t.wallet_id));

  conteudo.innerHTML = lista.map((t) => `
    <div class="card">
      <div class="info">
        <div class="nome">${cacheNomes[t.wallet_id] || 'Desconhecido'}</div>
        <div class="detalhe">Chave Pix: ${extrairChavePix(t.description)}</div>
        <div class="data">${fmtData(t.created_at)}</div>
      </div>
      <div class="direita">
        <div class="valor">${fmtBRL(t.amount)}</div>
        ${status === 'pending'
          ? `<button class="acao" data-id="${t.id}" onclick="marcarPago('${t.id}')">Marcar como pago</button>`
          : `<span class="pagoTag">✓ Pago</span>`}
      </div>
    </div>
  `).join('');
}

async function marcarPago(id) {
  const btn = document.querySelector(`button[data-id="${id}"]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Marcando...'; }
  try {
    const { data, error } = await sb.rpc('marcar_saque_pago', { p_transaction_id: id });
    if (error) throw error;
    if (data && data.ok) renderSaques('pending', 'Nenhum saque pendente no momento.');
    else alert('Não foi possível marcar como pago.');
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}
window.marcarPago = marcarPago;

async function renderDepositos() {
  const conteudo = document.getElementById('conteudo');
  conteudo.innerHTML = '<div class="loading">Carregando...</div>';
  const { data, error } = await sb
    .from('wallet_transactions')
    .select('id, wallet_id, amount, description, status, created_at')
    .eq('type', 'credit')
    .order('created_at', { ascending: false })
    .limit(50);
  if (error) { conteudo.innerHTML = '<div class="empty">Erro ao carregar: ' + error.message + '</div>'; return; }

  const lista = data || [];
  if (lista.length === 0) { conteudo.innerHTML = '<div class="empty">Nenhum depósito registrado ainda.</div>'; return; }

  await buscarNomes(lista.map((t) => t.wallet_id));

  conteudo.innerHTML = lista.map((t) => `
    <div class="card">
      <div class="info">
        <div class="nome">${cacheNomes[t.wallet_id] || 'Desconhecido'}</div>
        <div class="detalhe">${t.description || 'Crédito'}</div>
        <div class="data">${fmtData(t.created_at)}</div>
      </div>
      <div class="direita">
        <div class="valor valorVerde">+${fmtBRL(t.amount)}</div>
      </div>
    </div>
  `).join('');
}

async function renderEmpresas() {
  const conteudo = document.getElementById('conteudo');
  conteudo.innerHTML = '<div class="loading">Carregando...</div>';
  const { data, error } = await sb
    .from('empresas_parceiras')
    .select('id, razao_social, cnpj, plano, is_online, created_at')
    .order('created_at', { ascending: false });
  if (error) { conteudo.innerHTML = '<div class="empty">Erro ao carregar: ' + error.message + '</div>'; return; }

  const lista = data || [];
  if (lista.length === 0) { conteudo.innerHTML = '<div class="empty">Nenhuma empresa parceira cadastrada ainda.</div>'; return; }

  conteudo.innerHTML = lista.map((e) => {
    const planoClasse = (e.plano || 'bronze').toLowerCase();
    return `
    <div class="card">
      <div class="info">
        <div class="nome">${e.razao_social || 'Sem nome'}</div>
        <div class="detalhe">CNPJ: ${e.cnpj || '-'}</div>
        <div class="data">Desde ${fmtData(e.created_at)}</div>
      </div>
      <div class="direita">
        <span class="badge ${planoClasse}">${(e.plano || 'bronze').toUpperCase()}</span>
        <span class="badge ${e.is_online ? 'online' : 'offline'}">${e.is_online ? 'Online' : 'Offline'}</span>
      </div>
    </div>
  `; }).join('');
}

// ------------------------------------------------------------
// DOCUMENTOS - revisão dos cadastros (prestador autônomo,
// vinculado e empresa parceira) num só lugar. Os arquivos ficam
// em buckets PRIVADOS (provider-documents / company-documents),
// então a visualização usa signed URL (expira em 1h) gerada na
// hora - ninguém enxerga o documento sem passar por aqui.
// Atualiza sozinho em tempo real via Supabase Realtime.
// ------------------------------------------------------------
let abaDocumentos = 'pendentes';
const rotuloStatusDoc = {
  pending: 'Pendente (docs não enviados)',
  em_analise: 'Em análise',
  aprovado: 'Aprovado',
  rejeitado: 'Rejeitado',
};

async function buscarCadastros(statusAlvo) {
  const [{ data: prestadores, error: errP }, { data: empresas, error: errE }] = await Promise.all([
    sb.from('usuarios_prestadores')
      .select('id, bio, tipo_prestador, documents_status, documents_rejection_reason, antecedentes_document_path, rg_document_path')
      .in('documents_status', statusAlvo),
    sb.from('empresas_parceiras')
      .select('id, razao_social, cnpj, telefone, documents_status, documents_rejection_reason, autorizacao_pf_document_path')
      .in('documents_status', statusAlvo),
  ]);
  if (errP) throw errP;
  if (errE) throw errE;

  // Busca os perfis (nome/telefone/cpf) numa consulta separada. Fazemos
  // assim (em vez do embed profiles(...)) porque existe mais de uma FK
  // entre usuarios_prestadores e profiles, o que deixa o embed automático
  // ambíguo pro PostgREST.
  const idsPrestadores = (prestadores || []).map((p) => p.id);
  let mapaPerfis = {};
  if (idsPrestadores.length > 0) {
    const { data: perfis, error: errPerfis } = await sb
      .from('profiles')
      .select('id, full_name, phone, cpf_cnpj')
      .in('id', idsPrestadores);
    if (errPerfis) throw errPerfis;
    (perfis || []).forEach((pf) => { mapaPerfis[pf.id] = pf; });
  }

  const listaPrestadores = (prestadores || []).map((p) => {
    const perfil = mapaPerfis[p.id];
    return {
      tipo: 'prestador',
      id: p.id,
      nome: perfil ? perfil.full_name : 'Sem nome',
      telefone: perfil ? perfil.phone : '-',
      documento: perfil ? perfil.cpf_cnpj : '-',
      subtitulo: p.tipo_prestador === 'vinculado' ? 'Vinculado (empresa)' : 'Autônomo',
      bio: p.bio,
      documents_status: p.documents_status,
      documents_rejection_reason: p.documents_rejection_reason,
      docs: [
        { label: 'antecedentes criminais', bucket: 'provider-documents', path: p.antecedentes_document_path },
        { label: 'foto com RG', bucket: 'provider-documents', path: p.rg_document_path },
      ],
    };
  });

  const listaEmpresas = (empresas || []).map((e) => ({
    tipo: 'empresa',
    id: e.id,
    nome: e.razao_social,
    telefone: e.telefone,
    documento: e.cnpj,
    subtitulo: 'Empresa Parceira',
    bio: null,
    documents_status: e.documents_status,
    documents_rejection_reason: e.documents_rejection_reason,
    docs: [
      { label: 'autorização de funcionamento (PF)', bucket: 'company-documents', path: e.autorizacao_pf_document_path },
    ],
  }));

  return [...listaPrestadores, ...listaEmpresas];
}

async function abrirDocumento(bucket, path, btn) {
  if (!path) return;
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Abrindo...';
  try {
    const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
    if (error) throw error;
    window.open(data.signedUrl, '_blank');
  } catch (e) {
    alert('Não foi possível abrir o documento: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = textoOriginal;
  }
}
window.abrirDocumento = abrirDocumento;

async function aprovarCadastro(tipo, id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  try {
    const tabela = tipo === 'empresa' ? 'empresas_parceiras' : 'usuarios_prestadores';
    const campos = tipo === 'empresa'
      ? { documents_status: 'aprovado', verified: true, documents_rejection_reason: null }
      : { documents_status: 'aprovado', verified: true, documents_rejection_reason: null };
    const { error } = await sb.from(tabela).update(campos).eq('id', id);
    if (error) throw error;
    renderDocumentos();
  } catch (e) {
    alert('Não foi possível aprovar: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Aprovar'; }
  }
}
window.aprovarCadastro = aprovarCadastro;

async function rejeitarCadastro(tipo, id, btn) {
  const inputMotivo = document.getElementById('motivo_' + tipo + '_' + id);
  const motivo = inputMotivo ? inputMotivo.value.trim() : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  try {
    const tabela = tipo === 'empresa' ? 'empresas_parceiras' : 'usuarios_prestadores';
    const campos = tipo === 'empresa'
      ? { documents_status: 'rejeitado', verified: false, documents_rejection_reason: motivo || null }
      : { documents_status: 'rejeitado', verified: false, documents_rejection_reason: motivo || null };
    const { error } = await sb.from(tabela).update(campos).eq('id', id);
    if (error) throw error;
    renderDocumentos();
  } catch (e) {
    alert('Não foi possível rejeitar: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Rejeitar'; }
  }
}
window.rejeitarCadastro = rejeitarCadastro;

function trocarAbaDocumentos(sub) {
  abaDocumentos = sub;
  renderDocumentos();
}
window.trocarAbaDocumentos = trocarAbaDocumentos;

async function renderDocumentos() {
  const conteudo = document.getElementById('conteudo');
  const statusAlvo = abaDocumentos === 'pendentes' ? ['pending', 'em_analise'] : ['aprovado', 'rejeitado'];

  const subTabsHtml = `
    <div class="subTabs">
      <button class="subTabBtn ${abaDocumentos === 'pendentes' ? 'active' : ''}" onclick="trocarAbaDocumentos('pendentes')">Pendentes</button>
      <button class="subTabBtn ${abaDocumentos === 'revisados' ? 'active' : ''}" onclick="trocarAbaDocumentos('revisados')">Já revisados</button>
    </div>`;

  conteudo.innerHTML = subTabsHtml + '<div class="loading">Carregando...</div>';

  let lista;
  try {
    lista = await buscarCadastros(statusAlvo);
  } catch (e) {
    conteudo.innerHTML = subTabsHtml + '<div class="empty">Erro ao carregar: ' + e.message + '</div>';
    return;
  }

  if (abaAtiva !== 'documentos') return; // usuário já trocou de aba enquanto carregava

  if (lista.length === 0) {
    conteudo.innerHTML = subTabsHtml + '<div class="empty">' +
      (abaDocumentos === 'pendentes' ? 'Nenhum cadastro pendente de revisão.' : 'Nenhum cadastro revisado ainda.') +
      '</div>';
    return;
  }

  conteudo.innerHTML = subTabsHtml + lista.map((p) => `
    <div class="docCard">
      <div class="docTopo">
        <div>
          <div class="nome">${p.nome || 'Sem nome'}</div>
          <div class="detalhe">Tel: ${p.telefone || '-'} · Doc: ${p.documento || '-'}</div>
          <div class="data">${p.subtitulo}</div>
        </div>
        <span class="badge ${p.documents_status}">${rotuloStatusDoc[p.documents_status] || p.documents_status}</span>
      </div>
      ${p.bio ? `<div class="detalhe" style="margin-bottom:10px;">${p.bio}</div>` : ''}
      <div class="docBotoes">
        ${p.docs.map((doc) => doc.path
          ? `<button class="docBtn" onclick="abrirDocumento('${doc.bucket}','${doc.path}', this)">Ver ${doc.label}</button>`
          : `<button class="docBtn" disabled>${doc.label.charAt(0).toUpperCase() + doc.label.slice(1)} não enviado(a)</button>`
        ).join('')}
      </div>
      ${p.documents_status === 'rejeitado' && p.documents_rejection_reason
        ? `<div class="motivoRejeitado">Motivo da rejeição: ${p.documents_rejection_reason}</div>` : ''}
      ${abaDocumentos === 'pendentes' ? `
        <div class="docAcoes">
          <input id="motivo_${p.tipo}_${p.id}" placeholder="Motivo da rejeição (opcional)">
          <button class="rejeitarBtn" onclick="rejeitarCadastro('${p.tipo}','${p.id}', this)">Rejeitar</button>
          <button class="aprovarBtn" onclick="aprovarCadastro('${p.tipo}','${p.id}', this)">Aprovar</button>
        </div>` : ''}
    </div>
  `).join('');
}

// ------------------------------------------------------------
// TODAS AS CONTAS - lista todo mundo cadastrado na plataforma
// (cliente, prestador autônomo/vinculado e empresa parceira) com
// e-mail. O e-mail vem via RPC admin_listar_contas (só admin
// consegue chamar - confere isso no próprio banco). Tem busca por
// nome/e-mail e atualiza sozinho em tempo real.
// ------------------------------------------------------------
let contasCache = [];
let buscaContasTexto = '';

const rotuloRole = {
  client: 'Cliente',
  provider: 'Prestador',
  company: 'Empresa Parceira',
};

function filtrarContas() {
  const termo = buscaContasTexto.trim().toLowerCase();
  if (!termo) return contasCache;
  return contasCache.filter((c) =>
    (c.full_name || '').toLowerCase().includes(termo) ||
    (c.email || '').toLowerCase().includes(termo) ||
    (c.phone || '').toLowerCase().includes(termo)
  );
}

function desenharListaContas() {
  const conteudo = document.getElementById('conteudo');
  const buscaHtml = `
    <input
      id="buscaContasInput"
      class="buscaContas"
      placeholder="Buscar por nome, e-mail ou telefone..."
      value="${buscaContasTexto.replace(/"/g, '&quot;')}"
      oninput="buscaContasTexto = this.value; desenharListaContas();"
    >`;

  const lista = filtrarContas();
  if (lista.length === 0) {
    conteudo.innerHTML = buscaHtml + '<div class="empty">Nenhuma conta encontrada.</div>';
    return;
  }

  conteudo.innerHTML = buscaHtml + `<div style="margin-bottom:10px;color:#8A97A3;font-size:12px;">Total: <b style="color:#fff;">${lista.length}</b></div>` +
    lista.map((c) => `
    <div class="card contaCard">
      <div class="info">
        <div class="nome">${c.full_name || 'Sem nome'} <span class="roleTag ${c.role}">${rotuloRole[c.role] || c.role}</span></div>
        <div class="email">${c.email || '-'}</div>
        <div class="detalhe">Tel: ${c.phone || '-'}</div>
        <div class="data">Cadastrado em ${fmtData(c.created_at)}</div>
      </div>
    </div>
  `).join('');

  // Reposiciona o cursor no input depois de re-renderizar (o innerHTML
  // recria o elemento, então sem isso o foco se perde a cada letra digitada)
  const inputEl = document.getElementById('buscaContasInput');
  if (inputEl) {
    inputEl.focus();
    const pos = inputEl.value.length;
    inputEl.setSelectionRange(pos, pos);
  }
}
window.desenharListaContas = desenharListaContas;

async function renderContas() {
  const conteudo = document.getElementById('conteudo');
  conteudo.innerHTML = '<div class="loading">Carregando...</div>';
  try {
    const { data, error } = await sb.rpc('admin_listar_contas');
    if (error) throw error;
    contasCache = data || [];
    if (abaAtiva !== 'contas') return;
    desenharListaContas();
  } catch (e) {
    conteudo.innerHTML = '<div class="empty">Erro ao carregar: ' + e.message + '</div>';
  }
}

// ------------------------------------------------------------
// PERFIL TÁTICO - lista todo prestador autônomo/vinculado com um
// toggle pra liberar (ou não) esse serviço armado. A trava de
// verdade fica no banco (trigger); esse toggle aqui é só a
// interface pra ligar/desligar a permissão.
// ------------------------------------------------------------
async function toggleTatico(id, habilitarAgora, btn) {
  if (btn) { btn.disabled = true; }
  try {
    const { error } = await sb.from('usuarios_prestadores')
      .update({ perfil_tatico_habilitado: habilitarAgora })
      .eq('id', id);
    if (error) throw error;
    renderTatico();
  } catch (e) {
    alert('Não foi possível atualizar: ' + e.message);
    if (btn) { btn.disabled = false; }
  }
}
window.toggleTatico = toggleTatico;

async function renderTatico() {
  const conteudo = document.getElementById('conteudo');
  conteudo.innerHTML = '<div class="loading">Carregando...</div>';
  try {
    const { data, error } = await sb.rpc('admin_listar_prestadores_tatico');
    if (error) throw error;
    const lista = data || [];
    const alerta = '<div class="taticoAlerta">⚠️ Serviço armado. Só habilite prestadores que você confirmou pessoalmente serem policiais ou equivalentes autorizados.</div>';
    if (lista.length === 0) {
      conteudo.innerHTML = alerta + '<div class="empty">Nenhum prestador cadastrado ainda.</div>';
      return;
    }
    conteudo.innerHTML = alerta + lista.map((p) => `
      <div class="card">
        <div class="info">
          <div class="nome">${p.full_name || 'Sem nome'}</div>
          <div class="detalhe">${p.tipo_prestador === 'vinculado' ? 'Vinculado (empresa)' : 'Autônomo'} · Tel: ${p.phone || '-'}</div>
        </div>
        <div class="direita">
          <span style="font-size:11px;color:${p.perfil_tatico_habilitado ? '#10B981' : '#8A97A3'};font-weight:700;">${p.perfil_tatico_habilitado ? 'Habilitado' : 'Desabilitado'}</span>
          <button class="toggleSwitch ${p.perfil_tatico_habilitado ? 'on' : 'off'}" onclick="toggleTatico('${p.id}', ${!p.perfil_tatico_habilitado}, this)">
            <span class="bolinha"></span>
          </button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    conteudo.innerHTML = '<div class="empty">Erro ao carregar: ' + e.message + '</div>';
  }
}

function renderAba(tab) {
  abaAtiva = tab;
  document.querySelectorAll('.tabBtn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'saques') renderSaques('pending', 'Nenhum saque pendente no momento.');
  else if (tab === 'saquesPagos') renderSaques('completed', 'Nenhum saque pago ainda.');
  else if (tab === 'depositos') renderDepositos();
  else if (tab === 'empresas') renderEmpresas();
  else if (tab === 'documentos') renderDocumentos();
  else if (tab === 'online') renderOnline();
  else if (tab === 'contas') renderContas();
  else if (tab === 'tatico') renderTatico();
}

// ------------------------------------------------------------
// ONLINE AGORA / BANIDOS - prestadores (autônomo ou vinculado) E
// empresas parceiras. Sub-aba "Online agora" mostra quem está
// is_online = true nesse instante, com ações de tirar do ar ou
// banir. Sub-aba "Banidos" lista quem já foi banido, pra poder
// desbanir. Atualiza sozinho em tempo real via Realtime.
// ------------------------------------------------------------
let abaOnline = 'online';

async function buscarOnlineOuBanidos(filtro) {
  const [{ data: prestadores, error: errP }, { data: empresas, error: errE }] = await Promise.all([
    sb.from('usuarios_prestadores')
      .select('id, tipo_prestador, rating_avg, rating_count, banido, banido_motivo')
      .eq(filtro, true),
    sb.from('empresas_parceiras')
      .select('id, razao_social, telefone, banido, banido_motivo')
      .eq(filtro, true),
  ]);
  if (errP) throw errP;
  if (errE) throw errE;

  const idsPrestadores = (prestadores || []).map((p) => p.id);
  let mapaPerfis = {};
  if (idsPrestadores.length > 0) {
    const { data: perfis, error: errPerfis } = await sb
      .from('profiles')
      .select('id, full_name, phone')
      .in('id', idsPrestadores);
    if (errPerfis) throw errPerfis;
    (perfis || []).forEach((pf) => { mapaPerfis[pf.id] = pf; });
  }

  const listaPrestadores = (prestadores || []).map((p) => {
    const perfil = mapaPerfis[p.id];
    return {
      tipo: 'prestador',
      id: p.id,
      nome: perfil ? perfil.full_name : 'Sem nome',
      telefone: perfil ? perfil.phone : '-',
      subtitulo: p.tipo_prestador === 'vinculado' ? 'Vinculado (empresa)' : 'Autônomo',
      rating: p.rating_avg,
      ratingCount: p.rating_count,
      banido: p.banido,
      banido_motivo: p.banido_motivo,
    };
  });

  const listaEmpresas = (empresas || []).map((e) => ({
    tipo: 'empresa',
    id: e.id,
    nome: e.razao_social,
    telefone: e.telefone,
    subtitulo: 'Empresa Parceira',
    rating: null,
    ratingCount: null,
    banido: e.banido,
    banido_motivo: e.banido_motivo,
  }));

  return [...listaPrestadores, ...listaEmpresas];
}

async function colocarOffline(tipo, id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Colocando offline...'; }
  try {
    const tabela = tipo === 'empresa' ? 'empresas_parceiras' : 'usuarios_prestadores';
    const campos = tipo === 'empresa' ? { is_online: false } : { is_online: false, is_available: false };
    const { error } = await sb.from(tabela).update(campos).eq('id', id);
    if (error) throw error;
    renderOnline();
  } catch (e) {
    alert('Não foi possível colocar offline: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Colocar Offline'; }
  }
}
window.colocarOffline = colocarOffline;

async function toggleBanimento(tipo, id, banirAgora, btn) {
  const motivo = banirAgora ? prompt('Motivo do banimento (opcional):') : null;
  if (btn) { btn.disabled = true; btn.textContent = banirAgora ? 'Banindo...' : 'Desbanindo...'; }
  try {
    const tabela = tipo === 'empresa' ? 'empresas_parceiras' : 'usuarios_prestadores';
    const campos = banirAgora
      ? { banido: true, banido_motivo: motivo || null, is_online: false }
      : { banido: false, banido_motivo: null };
    if (tipo !== 'empresa' && banirAgora) campos.is_available = false;
    const { error } = await sb.from(tabela).update(campos).eq('id', id);
    if (error) throw error;
    renderOnline();
  } catch (e) {
    alert('Não foi possível atualizar o banimento: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = banirAgora ? 'Banir' : 'Desbanir'; }
  }
}
window.toggleBanimento = toggleBanimento;

function trocarAbaOnline(sub) {
  abaOnline = sub;
  renderOnline();
}
window.trocarAbaOnline = trocarAbaOnline;

async function renderOnline() {
  const conteudo = document.getElementById('conteudo');
  const subTabsHtml = `
    <div class="subTabs">
      <button class="subTabBtn ${abaOnline === 'online' ? 'active' : ''}" onclick="trocarAbaOnline('online')">Online agora</button>
      <button class="subTabBtn ${abaOnline === 'banidos' ? 'active' : ''}" onclick="trocarAbaOnline('banidos')">Banidos</button>
    </div>`;
  conteudo.innerHTML = subTabsHtml + '<div class="loading">Carregando...</div>';

  let lista;
  try {
    lista = await buscarOnlineOuBanidos(abaOnline === 'online' ? 'is_online' : 'banido');
  } catch (e) {
    conteudo.innerHTML = subTabsHtml + '<div class="empty">Erro ao carregar: ' + e.message + '</div>';
    return;
  }
  if (abaAtiva !== 'online') return; // trocou de aba enquanto carregava

  const topo = abaOnline === 'online'
    ? `<div class="onlineTopo"><span class="onlineContagem"><span class="pulseDot"></span>Online agora: <b>${lista.length}</b></span></div>`
    : `<div class="onlineTopo"><span class="onlineContagem">Banidos: <b>${lista.length}</b></span></div>`;

  if (lista.length === 0) {
    conteudo.innerHTML = subTabsHtml + topo + '<div class="empty">' +
      (abaOnline === 'online' ? 'Ninguém online no momento.' : 'Ninguém banido no momento.') +
      '</div>';
    return;
  }

  conteudo.innerHTML = subTabsHtml + topo + lista.map((p) => `
    <div class="onlineCard">
      <div class="esquerda">
        ${abaOnline === 'online' ? '<span class="pulseDot"></span>' : ''}
        <div>
          <div class="nome">${p.nome || 'Sem nome'}</div>
          <div class="detalhe">${p.subtitulo} · Tel: ${p.telefone || '-'}</div>
          ${p.banido && p.banido_motivo ? `<div class="motivoRejeitado">Motivo do ban: ${p.banido_motivo}</div>` : ''}
        </div>
      </div>
      <div class="direita">
        ${p.rating != null ? `<span class="rating">★ ${Number(p.rating || 0).toFixed(1)} (${p.ratingCount || 0})</span>` : ''}
        ${abaOnline === 'online' ? `
          <button class="docBtn" onclick="colocarOffline('${p.tipo}','${p.id}', this)">Colocar Offline</button>
          <button class="rejeitarBtn" onclick="toggleBanimento('${p.tipo}','${p.id}', true, this)">Banir</button>
        ` : `
          <button class="aprovarBtn" onclick="toggleBanimento('${p.tipo}','${p.id}', false, this)">Desbanir</button>
        `}
      </div>
    </div>
  `).join('');
}


// Tempo real: qualquer INSERT/UPDATE em usuarios_prestadores ou
// empresas_parceiras atualiza a aba Documentos sozinha, sem F5 -
// tanto pra novos cadastros chegando quanto pra mudanças de status
// feitas por outro admin em outra aba/computador.
let canalDocumentosRealtime = null;
function iniciarRealtimeDocumentos() {
  if (canalDocumentosRealtime) return;
  canalDocumentosRealtime = sb
    .channel('admin-documentos-realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'usuarios_prestadores' }, () => {
      if (abaAtiva === 'documentos') renderDocumentos();
      if (abaAtiva === 'online') renderOnline();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'empresas_parceiras' }, () => {
      if (abaAtiva === 'documentos') renderDocumentos();
      if (abaAtiva === 'online') renderOnline();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
      if (abaAtiva === 'contas') renderContas();
    })
    .subscribe();
}

document.querySelectorAll('.tabBtn').forEach((b) => b.addEventListener('click', () => renderAba(b.dataset.tab)));

document.getElementById('sairBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.reload();
});

async function tentarLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('loginErro');
  const btn = document.getElementById('loginBtn');
  erroEl.classList.add('hidden');
  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; erroEl.classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) throw error;
    const userId = data && data.user ? data.user.id : null;
    if (!userId) throw new Error('Não foi possível identificar sua conta.');

    const { data: adminRow } = await sb.from('admin_users').select('id').eq('id', userId).maybeSingle();
    if (!adminRow) {
      await sb.auth.signOut();
      throw new Error('Essa conta não tem acesso ao painel de administrador.');
    }
    mostrarPainel();
  } catch (e) {
    erroEl.textContent = e.message || 'Falha ao entrar.';
    erroEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}
document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('loginSenha').addEventListener('keydown', (e) => { if (e.key === 'Enter') tentarLogin(); });

function mostrarPainel() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('painel').classList.remove('hidden');
  renderAba('saques');
  iniciarRealtimeDocumentos();
}

(async function verificarSessao() {
  const { data } = await sb.auth.getSession();
  const userId = data && data.session ? data.session.user.id : null;
  if (!userId) return;
  const { data: adminRow } = await sb.from('admin_users').select('id').eq('id', userId).maybeSingle();
  if (adminRow) mostrarPainel();
})();
</script>
